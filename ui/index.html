<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Class Discussion Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="brand">
          <h1>Class Discussion Board</h1>
        </div>

        <div class="header-actions">
          <button class="btn btn-secondary" type="button">Add course</button>
          <button class="btn btn-primary" type="button">Add discussion</button>
        </div>
      </header>

      <main>
        <div class="section-header">
          <h2>Discussions</h2>
          <span class="section-count">2 discussions</span>
        </div>

        <ul class="discussion-list">
          <li class="discussion-row">
            <div class="discussion-main">
              <div class="discussion-course">CSCI 294 · Machine Learning</div>
              <h3 class="discussion-title">Question about HW01</h3>
              <p class="discussion-meta">
                Started by Connor · September 19, 2026 at 10:30 AM
              </p>
            </div>

            <div class="discussion-side">
              <span class="post-count">1 post</span>
              <button class="btn btn-primary" type="button">
                View discussion
              </button>
            </div>
          </li>

          <li class="discussion-row">
            <div class="discussion-main">
              <div class="discussion-course">CSCI 390 · Cloud Computing</div>
              <h3 class="discussion-title">Question about EC2</h3>
              <p class="discussion-meta">
                Started by Connor · September 17, 2026 at 12:30 PM
              </p>
            </div>

            <div class="discussion-side">
              <span class="post-count">2 posts</span>
              <button class="btn btn-primary" type="button">
                View discussion
              </button>
            </div>
          </li>
        </ul>
      </main>
    </div>
  </body>
</html>
